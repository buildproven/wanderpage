allowBuilds:
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@workflow/astro@4.0.27"
  - "@workflow/builders@4.1.17"
  - "@workflow/cli@4.3.16"
  - "@workflow/core@4.8.12"
  - "@workflow/next@4.1.16"
  - "@workflow/nitro@4.1.18"
  - "@workflow/nuxt@4.0.28"
  - "@workflow/rollup@4.0.27"
  - "@workflow/sveltekit@4.0.27"
  - "@workflow/vite@4.0.27"
  - "@workflow/web@4.1.28"
  - workflow@4.8.12
overrides:
  baseline-browser-mapping: ">=2.11.0"
  brace-expansion: ">=5.0.12"
  devalue: ">=5.9.3"
  fast-uri: ">=3.1.6"
  "@workflow/nest": "-"
  nanoid: 5.1.16
  piscina: ">=4.9.4"
  postcss: ">=8.5.18"
  qs: ">=6.16.0"
  sharp: 0.35.5
  proxy-addr: ">=2.0.8"
  source-map-js: ">=1.2.2"
  compression: ">=1.8.2"
  browserslist: ">=4.28.7"
  minimatch: ">=9.0.3"
  undici: ">=7.29.1"
verifyDepsBeforeRun: warn
