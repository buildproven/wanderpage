# Gitleaks configuration for comprehensive secret detection
# Generated by create-qa-architect

[extend]
# Use default gitleaks rules as base
useDefault = true

# Additional custom patterns for common secrets
[[rules]]
description = "JWT tokens"
id = "jwt-token"
regex = '''eyJ[A-Za-z0-9_/+-]{10,}={0,2}'''
tags = ["key", "JWT"]

[[rules]]
description = "Environment variable secrets"
id = "env-secret"
regex = '''(?i)(api_key|secret|password|token)\s*=\s*['""][^'"\s]{10,}['""]'''
tags = ["env", "secret"]

# Allow only explicit placeholder values, generated dependency/build trees, and
# the pinned third-party claude-kit submodule. First-party Wanderpage files
# remain subject to every default and custom secret rule.
[allowlist]
description = "Placeholders, generated files, and vendored tooling"
regexes = ['''test_secret_.*|example_.*|dummy_.*|fake_.*|EXAMPLE_.*|your_.*_here|replace_with_.*''']
paths = ['''(^|/)(\.gitleaksignore|\.claude-kit/|node_modules/|dist/|build/|\.next/|coverage/)''']
