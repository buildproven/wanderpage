name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # Required for OIDC trusted publishing to npm
  contents: write # Required for creating GitHub releases

jobs:
  release:
    if: github.repository == 'buildproven/wanderpage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not on main. Refusing to publish." >&2
            exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.
      - name: Pin npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

      # Users of `npx @buildproven/wanderpage` have no checkout to run `pnpm mcpb`, so each release carries both files.
      # Built before npm publish, so a failed build stops the release before anything is published.
      - name: Build the desktop extension and skill ZIP
        run: pnpm mcpb

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Installation

            ```bash
            npx @buildproven/wanderpage
            ```

            ## Use Wanderpage in Claude

            - Claude Desktop extension: [wanderpage.mcpb](https://github.com/buildproven/wanderpage/releases/latest/download/wanderpage.mcpb)
            - Skill ZIP (upload at Customize > Skills): [wanderpage-skill.zip](https://github.com/buildproven/wanderpage/releases/latest/download/wanderpage-skill.zip)
          files: |
            dist/mcpb/wanderpage.mcpb
            dist/mcpb/wanderpage-skill.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
