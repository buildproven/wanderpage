name: Installer Parse

# REQ-INST-3: parse install.ps1 on every push to any branch. quality.yml runs
# the same installer-parse job (tests/ci/installer-parse-every-push.test.ts
# keeps the two identical) on pull requests and pushes to main, where the
# required summary check counts it. This workflow adds the branches and
# docs-only pushes that quality.yml's push filter skips.

on:
  push:

concurrency:
  group: installer-parse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Parse install.ps1 with PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = Join-Path $PWD 'install.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            foreach ($parseError in $parseErrors) {
              Write-Output "::error file=install.ps1,line=$($parseError.Extent.StartLineNumber),col=$($parseError.Extent.StartColumnNumber)::$($parseError.Message)"
            }
            exit 1
          }
          Write-Output 'install.ps1 parsed with no errors.'
